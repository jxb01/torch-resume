[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-resume"
version = "0.2.1"
description = "Change your model structure or loss mid-training and keep going -- without starting over."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jxb01" }]
keywords = [
    "pytorch", "training", "checkpoint", "resume", "optimizer-state",
    "weight-transfer", "fine-tuning", "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jxb01/torch-resume"
Issues = "https://github.com/jxb01/torch-resume/issues"

[tool.setuptools.packages.find]
include = ["torch_resume*"]
